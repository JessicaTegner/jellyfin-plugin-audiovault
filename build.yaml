overview: "Audio-described movies and shows from AudioVault, downloaded on demand"
description: >
  Indexes the AudioVault catalog as .strm libraries so every title is searchable in Jellyfin.
  Pressing play downloads that title, wraps the audio in an MP4 with a black video track and caches it.

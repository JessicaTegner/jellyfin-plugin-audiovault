name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The conversion tests run ffmpeg; AUDIOVAULT_REQUIRE_FFMPEG=1 makes them fail instead of skipping without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        env:
          AUDIOVAULT_REQUIRE_FFMPEG: "1"
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
